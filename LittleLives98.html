<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Lives</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --navy:#0b2350; --deep:#0f2b62; --blue:#1d4a92; --mid:#2f69bd; --sky:#7ec3ff; --ice:#cfeaff;
  --edge:#8cc4ff; --green:#7ee05a; --green2:#2f9a1e; --gold:#ffd447; --red:#ff5a4a;
  --font:"Trebuchet MS","Segoe UI",Verdana,Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1a3a;font:600 12px var(--font);color:#fff;user-select:none;cursor:default}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
canvas[data-por]{border-radius:50%;border:2px solid #fff}
#game{position:absolute;inset:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}

/* ---------- shared bits ---------- */
.panel{background:linear-gradient(180deg,rgba(40,92,170,.96),rgba(14,40,92,.97) 55%,rgba(9,28,70,.98));
  border:2px solid var(--edge);border-radius:22px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.55)}
.inset{background:linear-gradient(180deg,rgba(4,16,42,.85),rgba(10,32,74,.85));border:1px solid rgba(140,196,255,.45);border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.btn{font:700 12px var(--font);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);border:2px solid #0b2a5e;border-radius:999px;padding:6px 16px;cursor:pointer;
  background:linear-gradient(180deg,#9fd3ff 0%,#4e93e2 42%,#2659ad 58%,#3f7fd6 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 3px rgba(0,0,0,.45);transition:filter .1s, transform .05s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.down,.btn.on{background:linear-gradient(180deg,#d4ffb8 0%,#86de5a 42%,#3a9d24 58%,#62c63e 100%);border-color:#174d0c}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.rbtn{width:36px;height:36px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;
  background:radial-gradient(circle at 35% 28%,#e2f3ff 0%,#7cb9f5 28%,#2d64b8 70%,#1a3f82 100%)}
.rbtn.down,.rbtn.on{background:radial-gradient(circle at 35% 28%,#f0ffe2 0%,#9ee87a 28%,#3a9d24 70%,#215f12 100%)}
.rbtn img{width:18px;height:18px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
input[type=text],select{font:700 12px var(--font);color:#0b2350;padding:4px 10px;border:2px solid #0b2a5e;border-radius:999px;background:linear-gradient(180deg,#ffffff,#d8ecff);height:28px;outline:none}
input[type=checkbox]{width:16px;height:16px;accent-color:#3a9d24;vertical-align:middle}
.small{font-size:11px;color:#bcdcff;font-weight:600}
.pos{color:#9cff7a}.neg{color:#ff9a8a}
h4{margin:0 0 5px;font-size:12px;color:var(--ice);letter-spacing:.3px}
.list{padding:2px 4px;min-height:24px}
.row{display:flex;align-items:center;gap:8px;padding:3px 6px;border-bottom:1px solid rgba(140,196,255,.18)}
.row:last-child{border-bottom:0}
.row img{image-rendering:pixelated;width:16px;height:16px;flex:none}
.row .r{margin-left:auto;white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.list.sunken{background:linear-gradient(180deg,rgba(4,16,42,.75),rgba(10,32,74,.75));border:1px solid rgba(140,196,255,.4);border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}

/* bars */
.bar{height:14px;border-radius:999px;background:linear-gradient(180deg,#051330,#123067);border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 2px 3px rgba(0,0,0,.7);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),var(--c,#3e9d1f);box-shadow:0 0 6px var(--c,#3e9d1f);transition:width .3s}
.bar.small{height:10px}
.bar.bi>i{position:absolute;top:0;bottom:0}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;background:#0a1d40;box-shadow:inset 0 1px 2px rgba(0,0,0,.8);border:1px solid rgba(140,196,255,.3)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff,var(--pc,#5fb0ff) 60%);border-color:rgba(255,255,255,.5)}

/* ---------- live mode HUD ---------- */
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px),linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%)}
.panel{position:relative}
.tray{border-radius:30px;padding:8px}
#hud{position:absolute;inset:0;pointer-events:none}
#lhud{position:absolute;left:10px;bottom:10px;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
#lhud>*,#rhud>*{pointer-events:auto}
#family{display:flex;flex-direction:column-reverse;gap:7px;max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:none}
.por{width:46px;height:46px;border-radius:50%;position:relative;cursor:pointer;border:3px solid var(--edge);background:#8fd0ff;box-shadow:0 3px 6px rgba(0,0,0,.55);flex:none;transition:transform .1s}
.por:hover{transform:scale(1.08)}
.por canvas{width:100%;height:100%;border-radius:50%;display:block}
.por.sel{border-color:#9cff7a;box-shadow:0 0 0 3px rgba(126,224,90,.5),0 3px 6px rgba(0,0,0,.55)}
.por .badge{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb0a0,#e02a1a);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.por .away{position:absolute;left:-6px;right:-6px;bottom:-7px;text-align:center;font-size:9px;background:#1d4a92;border:1px solid var(--edge);border-radius:999px;padding:0 3px}
#puckCol{display:flex;flex-direction:column;align-items:center;gap:6px;width:262px}
#wfTray{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;max-width:262px}
#wantsRow,#fearsRow{display:flex;gap:4px}
.wfSep{width:2px;height:26px;background:rgba(140,196,255,.45);border-radius:2px;margin:0 2px}
.wf{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff,#d9eeff 40%,#7fb6ea);border:3px solid #3a9d24;box-shadow:0 2px 4px rgba(0,0,0,.5);transition:transform .1s}
.wf:hover{transform:scale(1.15);z-index:2}
.wf.fear{border-color:#d0352a;background:radial-gradient(circle at 35% 30%,#fff,#ffe2de 40%,#e99a90)}
.wf img{width:16px;height:16px;image-rendering:pixelated}
.wf.empty{opacity:.3}
.wfLbl{font-size:8px;color:#bcdcff;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px}
#puck{width:164px;height:164px;border-radius:50%;position:relative;cursor:pointer;padding:7px;
  background:conic-gradient(from 210deg,#f4fbff,#7aa6d8,#e9f4ff,#5a86c0,#f4fbff,#7aa6d8,#f4fbff);
  box-shadow:0 0 0 3px #0b2350,0 8px 20px rgba(0,0,0,.6),inset 0 0 6px rgba(0,0,0,.5)}
#moodRing{width:100%;height:100%;border-radius:50%;padding:8px;background:conic-gradient(var(--mc,#7ee05a) calc(var(--mv,50)*1%),#0b2350 0);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
#bigPor{width:100%;height:100%;border-radius:50%;display:block;background:#8fd0ff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 2px #0b2350}
#nameplate{margin-top:-22px;z-index:2;pointer-events:none}
#nameplate b{display:inline-block;background:linear-gradient(180deg,#7ab8ff,#2f69bd 55%,#1d4a92);border:2px solid #e2f2ff;border-radius:999px;padding:4px 16px;font-size:13px;box-shadow:0 3px 6px rgba(0,0,0,.55);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#lpanel{height:206px;width:clamp(340px,calc(100vw - 640px),660px);display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;gap:6px;align-items:center;padding:8px 12px 8px;background:linear-gradient(180deg,rgba(130,190,255,.35),rgba(130,190,255,.05));border-bottom:1px solid rgba(140,196,255,.35)}
.phead .rbtn{width:32px;height:32px}
#tabTitle{margin-left:6px;font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.6);letter-spacing:.5px;white-space:nowrap}
#doing{margin-left:auto;font-size:11px;color:#bcdcff;max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 10px}
.pbody{flex:1;min-height:0;display:flex;gap:10px;padding:8px 12px 12px}
#aspTube{width:24px;flex:none;border-radius:12px;position:relative;background:linear-gradient(90deg,#051330,#123067,#051330);border:2px solid var(--edge);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
#aspTube>i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.6) 40%,rgba(255,255,255,.1)),var(--ac,#7ee05a);transition:height .4s;box-shadow:0 0 8px var(--ac,#7ee05a)}
#aspTube>span{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.35)}
#tabBody{flex:1;min-width:0;overflow:auto;padding:8px 10px;scrollbar-width:thin;scrollbar-color:#5aa0f0 transparent}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.need{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:6px;font-size:12px}
.need img{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;margin-right:4px}
#rhud{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#camBtns{display:grid;grid-template-columns:repeat(3,26px);gap:3px;padding:7px;border-radius:24px}
#camBtns .rbtn{width:26px;height:26px;font-size:10px}
#rpanel{width:258px;padding:10px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:7px}
#dayArc{width:200px;height:34px;position:relative;margin-top:2px}
#dayArc svg{position:absolute;inset:0}
#sunDot{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);transition:left .4s,top .4s}
#clockFace{width:100%;text-align:center;margin-top:-6px}
#clockFace .t{font-size:27px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 3px rgba(0,0,0,.6);line-height:30px}
#clockFace .d{font-size:11px;color:#bcdcff}
#funds{background:linear-gradient(180deg,#1a3d10,#2f6a1c);border:2px solid #9cff7a;border-radius:999px;padding:2px 16px;font-size:15px;font-weight:800;color:#d9ffc8;text-shadow:0 1px 2px #000;box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 10px rgba(126,224,90,.25)}
.speedrow{display:flex;gap:6px}
#paused{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:16px;font-weight:800;letter-spacing:4px;color:#ffe680;text-shadow:0 2px 0 #7a4b00,0 0 10px rgba(255,200,40,.7);pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#convo{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;z-index:5;pointer-events:none}
#convo canvas{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
#convo .cv{width:220px}
#convo .cvl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
#convo .cvl span:nth-child(2){color:#ffe680}
/* create-a-sim */
#cas{position:absolute;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;gap:30px;padding:20px}
.casSky{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#bfe6ff,#4f9be8 55%,#163f86)}
.casTitle{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:900 34px var(--font);text-shadow:0 3px 0 #1d4a92,0 6px 12px rgba(0,0,0,.4);-webkit-text-stroke:1px #1d4a92}
.casStage{position:relative;width:300px;height:470px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pedestal{position:absolute;bottom:58px;width:240px;height:60px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#ffffff,#9fd0ff 50%,#3d7ad0);box-shadow:0 10px 24px rgba(0,0,0,.4)}
#casView{position:relative;width:240px;height:300px;margin-bottom:84px}
.casRot{position:absolute;bottom:8px;display:flex;gap:14px}
.casName{position:absolute;top:20px;background:rgba(10,35,80,.75);border:2px solid var(--edge);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:800;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.casPanel{position:relative;width:min(560px,calc(100vw - 380px));height:470px;padding:12px;display:flex;flex-direction:column;gap:10px}
.casTabs{display:flex;gap:6px;flex-wrap:wrap}
.casBody{flex:1;overflow:auto;padding:12px 14px}
.casFoot{display:flex;gap:8px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.35);box-shadow:inset 0 -3px 4px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.4);transition:transform .1s}
.sw:hover{transform:scale(1.15)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px #3a9d24,0 2px 3px rgba(0,0,0,.4)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 12px;border-radius:999px;cursor:pointer;font-size:12px;background:linear-gradient(180deg,#4f8fdc,#1d4a92);border:2px solid rgba(207,234,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pill:hover{filter:brightness(1.2)}
.pill.on{background:linear-gradient(180deg,#d4ffb8,#86de5a 45%,#3a9d24);border-color:#fff;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.pill.big{font-size:14px;padding:7px 16px}
.trow{display:flex;align-items:center;gap:8px;margin:7px 0}
.trow .tl{width:72px;font-size:12px}.trow .tl.r{text-align:left}
.trow .tb{width:24px;height:24px;font-size:14px}
/* queue */
#queue{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:flex-start}
.qi{width:52px;height:52px;border-radius:50%;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 28%,#e8f5ff 0%,#8cc4f5 30%,#2d64b8 75%,#1a3f82 100%);border:3px solid var(--edge);box-shadow:0 3px 6px rgba(0,0,0,.55)}
.qi img{width:28px;height:28px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.qi.cur{width:62px;height:62px;border-color:#9cff7a;box-shadow:0 0 0 3px rgba(126,224,90,.45),0 3px 6px rgba(0,0,0,.55)}
.qi.cur img{width:34px;height:34px}
.qi:hover::after{content:'✕';position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:#e02a1a;border:2px solid #fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.qi .ql{position:absolute;top:100%;margin-top:3px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:rgba(10,35,80,.85);border:1px solid var(--edge);border-radius:999px;padding:1px 7px;display:none}
.qi:hover .ql,.qi.cur .ql{display:block}

/* toasts */
#toasts{position:absolute;right:12px;top:12px;width:300px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;padding:7px 12px 7px 7px;border-radius:16px;font-size:12px;line-height:15px;animation:slidein .25s ease-out}
.toast .tic{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff,#cfe8ff 50%,#7fb6ea);border:2px solid #fff}
.toast img{width:18px;height:18px;image-rendering:pixelated}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
#hoverTip{position:absolute;pointer-events:none;background:rgba(10,35,80,.9);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;font-size:11px;white-space:nowrap;z-index:40}
#statusMsg{position:absolute;left:50%;top:100px;transform:translateX(-50%);background:rgba(10,35,80,.9);border:2px solid var(--edge);border-radius:999px;padding:5px 16px;font-size:12px;pointer-events:none;transition:opacity .4s;white-space:nowrap}

/* pie menu */
#pie{position:absolute;inset:0;z-index:60}
.pieHead{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px rgba(29,74,146,.8),0 6px 14px rgba(0,0,0,.6);background:#8fd0ff;overflow:hidden;cursor:pointer;transform:translate(-50%,-50%);animation:pop .15s ease-out}
.pieHead canvas{width:100%;height:100%;display:block}
.pieTitle{position:absolute;transform:translate(-50%,0);font-size:12px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none}
.pieOpt{position:absolute;white-space:nowrap;padding:5px 14px;border-radius:999px;font-weight:800;font-size:12.5px;cursor:pointer;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.7);
  background:linear-gradient(180deg,#6aaaf0 0%,#2f69bd 50%,#1d4a92 100%);border:2px solid #cfeaff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 6px rgba(0,0,0,.55);animation:pop .18s ease-out both;display:flex;gap:6px;align-items:center}
.pieOpt img{width:16px;height:16px;image-rendering:pixelated}
.pieOpt:hover{background:linear-gradient(180deg,#d4ffb8 0%,#86de5a 45%,#3a9d24 100%);border-color:#fff;transform:scale(1.07)}
.pieOpt.sub::after{content:'▸';margin-left:2px;opacity:.85}
.pieOpt.dis{filter:grayscale(1) brightness(.75);cursor:default}
@keyframes pop{from{opacity:0;scale:.4}}

/* list menu (options) */
.menu{position:fixed;z-index:1000;padding:8px;min-width:200px;border-radius:16px}
.mi{padding:6px 26px 6px 32px;white-space:nowrap;position:relative;border-radius:999px;cursor:pointer;font-size:12.5px}
.mi img{position:absolute;left:9px;top:6px;width:16px;height:16px;image-rendering:pixelated}
.mi:hover:not(.dis),.mi.act{background:linear-gradient(180deg,#9ee87a,#3a9d24)}
.mi.dis{opacity:.45;cursor:default}
.mi.sub::after{content:'▸';position:absolute;right:10px}
.mi.chk::before{content:'✔';position:absolute;left:12px;color:#9cff7a}
.mi.chk:hover::before{color:#fff}
.msep{height:2px;margin:5px 8px;background:rgba(140,196,255,.3);border-radius:2px}
.mhead{padding:4px 10px 6px;font-weight:800;color:var(--ice);font-size:13px}

/* dialogs */
.dlg{position:absolute;z-index:500;min-width:300px;max-width:92%;padding:0;animation:pop .2s ease-out}
.dlg .titlebar{display:flex;align-items:center;gap:8px;padding:9px 12px 7px 16px;border-radius:20px 20px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));cursor:move}
.dlg .tt{flex:1;font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.5);letter-spacing:.3px}
.dlg .xbtn{width:24px;height:24px;font-size:11px}
.dlg .body{padding:6px 18px 8px;display:flex;gap:14px;align-items:flex-start}
.dlg .ic{width:54px;height:54px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff,#d6ecff 45%,#73aee8);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.dlg .ic img{width:32px;height:32px;image-rendering:pixelated}
.dlg .txt{flex:1;line-height:17px;max-height:440px;overflow:auto;font-size:12.5px;padding-top:4px}
.dlg .btns{display:flex;justify-content:center;gap:10px;padding:6px 14px 16px}
.dlg .btns .btn{min-width:86px}
.gazette{background:#f4efe0;color:#111;font-family:"Times New Roman",Times,serif;font-weight:400;padding:10px 12px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:rotate(-.6deg)}
.gazette h1{font:bold 26px "Times New Roman",serif;text-align:center;margin:0;border-bottom:3px double #111}
.gazette .dt{text-align:center;font-size:11px;border-bottom:1px solid #111;padding:2px 0;margin-bottom:6px}
.gazette h3{font:bold 14px "Times New Roman",serif;margin:6px 0 2px}
.gazette p{margin:2px 0 6px;font-size:13px}

.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}

<script>

/* =====================================================================

let G = null;          // the whole game state
const R = Math.random;
function ri(a, b) { return a + Math.floor(R() * (b - a + 1)); }

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function hash2(x, y, k = 0) { let h = (x * 374761393 + y * 668265263 + k * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function wpick(items, wfn) { let tot = 0; const ws = items.map(i => { const w = Math.max(0, wfn(i)); tot += w; return w; }); if (tot <= 0) return null; let r = R() * tot; for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }

/* ---------- time ---------- */
function minOfDay(t = G.time) { return ((t % 1440) + 1440) % 1440; }

function fmtClock(t = G.time) { const m = minOfDay(t); const h = Math.floor(m / 60), mm = Math.floor(m % 60); const ap = h < 12 ? 'AM' : 'PM'; let hh = h % 12; if (hh === 0) hh = 12; return hh + ':' + String(mm).padStart(2, '0') + ' ' + ap; }

/* ---------- colour ---------- */
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const _shade = {};
function shade(h, f) {
  const k = h + '|' + f; if (_shade[k]) return _shade[k];

/* ---------- sound (PC-speaker-ish WebAudio) ---------- */
const Snd = {

  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },

/* ---------------------------------------------------------------------
   Object queries & reservation
   --------------------------------------------------------------------- */
function objById(id) { if (id == null) return null; for (const o of G.objects) if (o.id === id) return o; return null; }
function objsOf(type) { return G.objects.filter(o => o.type === type); }
function addObj(type, props) { const d = OBJ[type]; const o = Object.assign({ id: G.nextId++, type, x: 0, y: 0, f: 'S', w: d.w, d: d.d, st: {} }, props); G.objects.push(o); if (d.block) rebuildBlock(); return o; }
function removeObj(o) { const i = G.objects.indexOf(o); if (i >= 0) { G.objects.splice(i, 1); if (OBJ[o.type].block) rebuildBlock(); } for (const s of G.sims) { if (s.cur && s.cur.obj === o.id && s.onLot) { finishAct(s, false); } } }
function objAt(x, y) { return G.objects.find(o => OBJ[o.type].block && x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.d); }
function reserve(o, i, id) { o.users = o.users || {}; o.users[i] = id; }
function release(objId, i, id) { const o = objById(objId); if (o && o.users && o.users[i] === id) delete o.users[i]; }
function slotFree(o, i, s) { const u = o.users && o.users[i]; if (u == null || u === s.id) return true; const other = simById(u); if (!other || !other.onLot || other.away || !other.cur || other.cur.obj !== o.id) { delete o.users[i]; return true; } return false; }
function freeSlot(o, s, filter) {
  const sl = slotsOf(o); let best = -1, bd = 1e9;
  for (let i = 0; i < sl.length; i++) { if (!slotFree(o, i, s)) continue; if (filter && !filter(sl[i], i)) continue; if (!passable(sl[i].ax, sl[i].ay)) continue; const d = dist(s.x, s.y, sl[i].ax + .5, sl[i].ay + .5); if (d < bd) { bd = d; best = i; } }
  return best;
}
function objInUse(o) { if (!o.users) return false; for (const k in o.users) { const s = simById(o.users[k]); if (s && s.cur && s.cur.obj === o.id) return true; } return false; }

/* ---------------------------------------------------------------------
   Pathfinding
   --------------------------------------------------------------------- */
function rebuildBlock() {
  blockMap = []; for (let x = 0; x < LOT_W; x++) blockMap[x] = new Uint8Array(LOT_H);
  for (const o of G.objects) { if (!OBJ[o.type].block) continue; for (let i = 0; i < o.w; i++) for (let j = 0; j < o.d; j++) { const X = o.x + i, Y = o.y + j; if (onLotTile(X, Y)) blockMap[X][Y] = 1; } }
}
function passable(x, y) { return x >= 0 && y >= 0 && x < LOT_W && y < LOT_H && !blockMap[x][y]; }
function edgeOpen(x, y, nx, ny) {
  const dx = nx - x, dy = ny - y;
  if (dx === 1) return wallW[nx][ny] !== 1; if (dx === -1) return wallW[x][y] !== 1;
  if (dy === 1) return wallN[nx][ny] !== 1; if (dy === -1) return wallN[x][y] !== 1; return true;
}
function canStep(x, y, nx, ny) {
  if (!passable(nx, ny)) return false;
  const dx = nx - x, dy = ny - y;
  if (dx && dy) return passable(x + dx, y) && passable(x, y + dy) && edgeOpen(x, y, x + dx, y) && edgeOpen(x + dx, y, nx, ny) && edgeOpen(x, y, x, y + dy) && edgeOpen(x, y + dy, nx, ny);
  return edgeOpen(x, y, nx, ny);
}
function findPath(sx, sy, tx, ty) {
  sx = Math.floor(sx); sy = Math.floor(sy);
  if (sx === tx && sy === ty) return [];
  if (!passable(tx, ty)) return null;
  const N = LOT_W * LOT_H, g = new Float32Array(N).fill(1e9), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const idx = (x, y) => x * LOT_H + y;
  const h = (x, y) => { const dx = Math.abs(x - tx), dy = Math.abs(y - ty); return Math.max(dx, dy) + .414 * Math.min(dx, dy); };
  const s = idx(clamp(sx, 0, LOT_W - 1), clamp(sy, 0, LOT_H - 1)); g[s] = 0;
  const open = [[h(sx, sy), s]];
  let iter = 0;
  while (open.length && iter++ < 4000) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
    const cur = open[bi][1]; open[bi] = open[open.length - 1]; open.pop();
    if (closed[cur]) continue; closed[cur] = 1;
    const cx = Math.floor(cur / LOT_H), cy = cur % LOT_H;
    if (cx === tx && cy === ty) { const path = []; let c = cur; while (c !== s && c >= 0) { path.push([Math.floor(c / LOT_H), c % LOT_H]); c = came[c]; } return path.reverse(); }
    for (const [dx, dy] of DIRS8) {
      const nx = cx + dx, ny = cy + dy; if (!onLotTile(nx, ny)) continue;
      const ni = idx(nx, ny); if (closed[ni] || !canStep(cx, cy, nx, ny)) continue;
      const ng = g[cur] + ((dx && dy) ? 1.414 : 1);
      if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; open.push([ng + h(nx, ny), ni]); }
    }
  }
  return null;
}
function nearestFree(x, y, maxR = 6, filter) {
  x = Math.floor(x); y = Math.floor(y);
  for (let r = 0; r <= maxR; r++) for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const X = x + dx, Y = y + dy; if (passable(X, Y) && (!filter || filter(X, Y))) return [X, Y];
  }
  return null;
}
function randomTileIn(roomId) {
  for (let i = 0; i < 40; i++) {
    let x, y;
    if (roomId) { const r = roomById(roomId); x = ri(r.x0, r.x1); y = ri(r.y0, r.y1); }
    else { x = ri(0, LOT_W - 1); y = ri(0, 16); if (roomAt(x, y)) continue; }
    if (passable(x, y)) return [x, y];
  }
  return null;
}
function freeYardTile() {
  const cands = [];
  for (let x = 19; x < LOT_W; x++) for (let y = 13; y <= 16; y++) if (passable(x, y) && !G.objects.some(o => o.x === x && o.y === y)) cands.push([x, y]);
  for (let x = 0; x <= 2; x++) for (let y = 3; y <= 16; y++) if (passable(x, y) && !G.objects.some(o => o.x === x && o.y === y)) cands.push([x, y]);
  return cands.length ? pick(cands) : null;
}

/* =====================================================================
   Rendering: isometric pixel world, sims, bubbles, particles
   ===================================================================== */
let view, vctx, buf, C, floorCache = null;
let animClock = 0;
const cam = { x: 0, y: 0, zoom: 2, follow: false };
const FX = [];
let goMarker = null;

function P(x, y, z = 0) { return [OX + (x - y) * 16 - cam.x, OY + (x + y) * 8 - z - cam.y]; }
function poly(pts, col) { C.fillStyle = col; C.beginPath(); C.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) C.lineTo(pts[i][0], pts[i][1]); C.closePath(); C.fill(); }
function B(x, y, z, w, d, h, col, top, left, right) {
  const t = top || shade(col, .22), l = left || col, r = right || shade(col, -.25);
  const a = P(x, y, z + h), b = P(x + w, y, z + h), c = P(x + w, y + d, z + h), dd = P(x, y + d, z + h);
  const c0 = P(x + w, y + d, z), d0 = P(x, y + d, z), b0 = P(x + w, y, z);
  if (h > 0) { poly([dd, c, c0, d0], l); poly([b, c, c0, b0], r); }
  poly([a, b, c, dd], t);
}
function faceS(yp, x0, x1, z0, z1, col) { poly([P(x0, yp, z0), P(x1, yp, z0), P(x1, yp, z1), P(x0, yp, z1)], col); }
function faceE(xp, y0, y1, z0, z1, col) { poly([P(xp, y0, z0), P(xp, y1, z0), P(xp, y1, z1), P(xp, y0, z1)], col); }
function topR(x0, y0, x1, y1, z, col) { poly([P(x0, y0, z), P(x1, y0, z), P(x1, y1, z), P(x0, y1, z)], col); }
function disc(x, y, z, r, col) {
  const [cx, cy] = P(x, y, z); C.fillStyle = col;
  for (let j = -r; j <= r; j++) { const w = Math.round(Math.sqrt(r * r - j * j)); C.fillRect(Math.round(cx - w), Math.round(cy + j * .8), w * 2, 1); }
}
function ell(cx, cy, rx, ry, col) { C.fillStyle = col; for (let j = -ry; j <= ry; j++) { const w = Math.round(rx * Math.sqrt(1 - (j * j) / (ry * ry + .01))); C.fillRect(Math.round(cx - w), Math.round(cy + j), w * 2, 1); } }
function px(x, y, w, h, col) { C.fillStyle = col; C.fillRect(x, y, w, h); }
function isNight() { const h = hourNow(); return h >= 20 || h < 6; }

/* ---------- floor cache ---------- */
function diamond(c, tx, ty, w, col) { c.fillStyle = col; const h = w / 2, hh = h / 2; for (let r = 0; r < h; r++) { const half = r < hh ? (r + 1) * 2 : (h - r) * 2; c.fillRect(Math.round(tx - half), Math.round(ty + r), half * 2, 1); } }
function buildFloorCache() {
  floorCache = document.createElement('canvas'); floorCache.width = WORLD_W; floorCache.height = WORLD_H;
  const c = floorCache.getContext('2d');
  c.fillStyle = '#3d8a34'; c.fillRect(0, 0, WORLD_W, WORLD_H);
  const W = (x, y) => [OX + (x - y) * 16, OY + (x + y) * 8];
  for (let s = 0; s < LOT_W + LOT_H; s++) for (let x = 0; x < LOT_W; x++) {
    const y = s - x; if (y < 0 || y >= LOT_H) continue;
    const t = floorMap[x][y]; const [tx, ty] = W(x, y);
    switch (t) {
      case 'grass': { const g = hash2(x, y) < .5 ? '#4a9a3a' : '#479536'; diamond(c, tx, ty, 32, g); c.fillStyle = '#5cb048'; for (let i = 0; i < 6; i++) { const a = hash2(x, y, i), b = hash2(y, x, i + 9); c.fillRect(Math.round(tx - 10 + a * 20), Math.round(ty + 3 + b * 10), 1, 1); } c.fillStyle = '#367a2c'; for (let i = 0; i < 4; i++) { const a = hash2(x, y, i + 30), b = hash2(y, x, i + 40); c.fillRect(Math.round(tx - 8 + a * 16), Math.round(ty + 4 + b * 8), 1, 1); } break; }
      case 'street': diamond(c, tx, ty, 32, '#4c4c54'); if (y === 19 && x % 2 === 0) { c.fillStyle = '#e8d040'; c.fillRect(tx - 4, ty - 2, 8, 1); c.fillRect(tx - 2, ty - 1, 4, 1); } break;
      case 'sidewalk': diamond(c, tx, ty, 32, '#b9b8ae'); diamond(c, tx, ty + 1, 28, '#c6c5bb'); break;
      case 'path': diamond(c, tx, ty, 32, '#b8946a'); diamond(c, tx, ty + 2, 24, '#c8a47a'); break;
      case 'wood': { diamond(c, tx, ty, 32, '#b47a3c'); c.fillStyle = '#9a6430'; for (let r = 2; r < 16; r += 4) { const half = r < 8 ? (r + 1) * 2 : (16 - r) * 2; c.fillRect(Math.round(tx - half + 2), ty + r, half * 2 - 4, 1); } break; }
      case 'tileW': for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const [sx, sy] = W(x + i / 2, y + j / 2); diamond(c, sx, sy, 16, (i + j) % 2 ? '#d8eef4' : '#f8fcff'); } break;
      case 'tileK': for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const [sx, sy] = W(x + i / 2, y + j / 2); diamond(c, sx, sy, 16, (i + j) % 2 ? '#202028' : '#f0f0e8'); } break;
      case 'carpetB': diamond(c, tx, ty, 32, '#7a5aa2'); c.fillStyle = '#8a6ab2'; for (let i = 0; i < 5; i++) c.fillRect(Math.round(tx - 8 + hash2(x, y, i) * 16), Math.round(ty + 4 + hash2(y, x, i) * 8), 1, 1); break;
      case 'carpetG': diamond(c, tx, ty, 32, '#4f8f9c'); c.fillStyle = '#5f9fac'; for (let i = 0; i < 5; i++) c.fillRect(Math.round(tx - 8 + hash2(x, y, i) * 16), Math.round(ty + 4 + hash2(y, x, i) * 8), 1, 1); break;
    }
  }
  // living room rug
  for (let x = 14; x <= 16; x++) for (let y = 10; y <= 11; y++) { const [tx, ty] = W(x, y); diamond(c, tx, ty, 32, '#a83030'); }
  for (let x = 14; x <= 16; x++) for (let y = 10; y <= 11; y++) { const [tx, ty] = W(x, y); diamond(c, tx, ty + 2, 24, (x + y) % 2 ? '#c04040' : '#b83838'); diamond(c, tx, ty + 6, 8, '#e8c050'); }
  // doormat
  { const [tx, ty] = W(13, 15); diamond(c, tx, ty + 3, 20, '#8a5a30'); }

/* =====================================================================
   Relationships, social interactions, witnesses & the Grapevine (gossip)
   ===================================================================== */
function rel(a, b) { const ka = a.id != null ? a.id : a, kb = b.id != null ? b.id : b; const k = ka + '|' + kb; let r = G.rels[k]; if (!r) r = G.rels[k] = { d: 0, l: 0 }; return r; }
function hasRel(a, b) { return !!G.rels[a.id + '|' + b.id]; }
function isFriendR(r) { return r.d >= 50 || (r.l >= 40 && r.d >= 30); }
function isBestR(r) { return r.l >= 75 && r.d >= 60; }
function relAdj(a, b, dd, dl) {
  if (!a || !b || a === b) return;
  const r = rel(a, b); const wasF = isFriendR(r), wasB = isBestR(r);
  r.d = clamp(r.d + dd, -100, 100); r.l = clamp(r.l + dl, -100, 100);
  const nowF = isFriendR(r);
  if (G.quiet) return;
  if (!wasF && nowF && a.stage !== 'baby' && b.stage !== 'baby') { fireEvent({ type: 'friend_made', a: a.id, b: b.id }); if (a.household) { toast(`${a.first} and ${b.first} are now friends!`, 'smile'); addMemory(a, `Became friends with ${b.first}`, true, 'smile'); } }
  if (wasF && !nowF) fireEvent({ type: 'friend_lost', a: a.id, b: b.id });
  if (!wasB && isBestR(r)) { fireEvent({ type: 'bestfriend', a: a.id, b: b.id }); if (a.household) addMemory(a, `Became best friends with ${b.first}`, true, 'star'); }
}
function relMutual(a, b, dd, dl) { relAdj(a, b, dd, dl); relAdj(b, a, dd, dl); }
function setFlag(a, b, f, v = true) { rel(a, b)[f] = v; rel(b, a)[f] = v; }
function famOf(a, b) { return rel(a, b).fam || null; }
function isFamily(a, b) { const f = famOf(a, b); return !!f && f !== 'spouse'; }
function partnerOf(s) { for (const k in G.rels) { const r = G.rels[k]; if ((r.married || r.engaged || r.steady) && k.startsWith(s.id + '|')) { const o = simById(+k.split('|')[1]); if (o && !o.dead) return o; } } return null; }
function isPartner(a, b) { const r = rel(a, b); return !!(r.married || r.engaged || r.steady); }
function romanceOK(a, b) {
  if (isFamily(a, b)) return false;
  const ag = x => x.stage === 'teen' ? 1 : (x.stage === 'adult' || x.stage === 'elder') ? 2 : 0;
  return ag(a) && ag(a) === ag(b);
}
function relLabels(a, b) {

function onHour(h) {
  fireEvent({ type: 'tick' });
  if (h === 7) deliverMail();
  scheduleRides(h);
  // lazy sleepers who missed the carpool alarm
  for (const s of householdSims()) if (s.lateRiser && s.carpoolWaiting && s.needs.energy >= 35) { s.lateRiser = false; interruptFor(s, goToWorkAct(s)); }
  // visitors
  const visiting = lotSims().filter(s => s.npc && !s.service).length;
  if (h >= 9 && h <= 20 && visiting < 2 && chance(.16)) { const c = npcs().filter(n => !n.onLot && !n.dead); const n = wpick(c, x => 1 + (x.gossipy || 0) * .4); if (n) npcArrive(n, 'door'); }
  if (h >= 8 && h <= 19 && chance(.22)) { const c = npcs().filter(n => !n.onLot && !n.dead); const n = c.length ? pick(c) : null; if (n) npcArrive(n, 'walkby'); }
  // social events with guests
  { const v = lotSims().find(x => x.visitor); const h = householdSims().find(x => x.onLot && !x.away && x.stage !== 'baby'); if (v && h && chance(.12)) maybeSocialEvent(h, v); }
  // guests judge the house
  for (const v of lotSims().filter(x => x.visitor)) {
    const sc = roomScore(roomAt(v.x, v.y));
    if (sc < 35 && chance(.6)) { react(v, 'disgust', 4, 'frown'); for (const h of householdSims()) relAdj(v, h, -3, -1); const h0 = householdSims()[0]; if (h0) addGossip('messy', h0.id, `${v.first} says the ${G.hhName} house is an absolute pigsty!`, -1, [v.id]); }
    else if (sc > 75 && chance(.3)) { react(v, 'happy', 3, 'house'); for (const h of householdSims()) relAdj(v, h, 2, 1); const h0 = householdSims()[0]; if (h0) addGossip('tidy', h0.id, `${v.first} raves about how lovely the ${G.hhName} home is.`, 1, [v.id]); }
  }
  // flowers wilt, plates go stale
  for (const o of G.objects) { if (o.type === 'flowers' && G.time - (o.st.watered || 0) > 2880) o.st.wilted = true; if (o.type === 'plate' && G.time - o.st.t > 480) o.st.old = true; if (o.type === 'platter' && G.time - o.st.made > 720) removeObj(o); }
  // aspiration drift + pensions
  for (const s of householdSims()) { if (s.stage === 'baby') continue; s.aspMeter = clamp(s.aspMeter - (s.aspMeter > 50 ? .45 : .25), 0, 100); }
  if (h === 9) for (const s of householdSims()) if (s.pension) G.money += s.pension;
  // smoke alarm auto-calls after the fire burns a while
  if (fireOnLot() && !G.fireCalled && G.fireStart != null && G.time - G.fireStart > 25) { G.fireCalled = true; G.pending.push({ at: G.time + 15, kind: 'fire' }); toast('The smoke alarm has alerted the fire department!', 'fire'); }
  uiDirty();
}
function onNewDay() {

  for (const s of liveSims()) {
    if (s.service) continue;
    s.ageDays++;
    if (s.ageDays >= STAGE_LEN[s.stage]) {
      if (s.stage === 'elder') { if (s.household) G.pending.push({ at: G.time + ri(9, 20) * 60, kind: 'death', id: s.id }); else if (!s.onLot) { s.dead = true; addGossip('death', s.id, `${fullName(s)} has passed away. The street feels quieter.`, 1, npcs().map(n => n.id)); } }

function convoKey(a, b) { return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; }
function convoOf(a, b) { G.convo = G.convo || {}; const k = convoKey(a, b); let c = G.convo[k]; if (!c) c = G.convo[k] = { v: 0, lvl: 0, t: 0 }; return c; }
function chemistry(a, b) { let d = 0; for (const k of TRAITS) d += Math.abs(a.pers[k] - b.pers[k]); return 1.3 - d / 40; } // ~0.3..1.3
function onConvo(s, t, d, acc) {
  if (!CONVO_SOCIALS.includes(d.id) || !(s.household || t.household) || s.stage === 'baby' || t.stage === 'baby') return;
  const c = convoOf(s, t);
  if (G.time - c.t > 180) c.v = 0;
  c.t = G.time; c.a = s.id; c.b = t.id;
  if (!acc) { c.v = Math.max(0, c.v - 10); uiDirty(); return; }
  const r = rel(t, s);
  c.v = clamp(c.v + 16 + r.d / 8 + chemistry(s, t) * 8 + (s.skills.charisma || 0) * .8, 0, 100);
  spawnFx('text', (s.x + t.x) / 2, (s.y + t.y) / 2, 34, { text: '+', col: '#9cff7a', vz: 10, life: 1 });
  if (c.v >= 100 && !G.chatUpOpen) setTimeout(() => chatUpgrade(s, t, c), 50);
  uiDirty();
}

function dragWin(el, handle) {
  handle.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    const mv = ev => { el.style.left = (ox + ev.clientX - sx) + 'px'; el.style.top = (oy + ev.clientY - sy) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
}

/* ---------- pie menu ---------- */
let pieStack = [];
function closePie() { const p = $('pie'); if (p) { p.classList.add('hide'); p.innerHTML = ''; } pieStack = []; }
function showPie(items, cx, cy, opts = {}) {
  const pie = $('pie'); pie.innerHTML = ''; pie.classList.remove('hide');
  const title = (items.find(i => i.head) || {}).head || opts.title || '';
  const opt = items.filter(i => !i.head && !i.sep);
  const n = opt.length;
  cx = clamp(cx, 190, innerWidth - 190); cy = clamp(cy, 130, innerHeight - 130);
  pie.onmousedown = e => { if (e.target === pie) { closePie(); } };
  pie.oncontextmenu = e => { e.preventDefault(); closePie(); };
  // centre head (the active sim)
  const head = document.createElement('div'); head.className = 'pieHead'; head.style.left = cx + 'px'; head.style.top = cy + 'px';
  head.title = pieStack.length ? 'Back' : 'Cancel';
  const cv = document.createElement('canvas'); cv.width = 70; cv.height = 70; head.appendChild(cv);
  const s = opts.sim || selSim(); if (s) drawPortrait(cv, s, 12, true);
  head.onmousedown = e => { e.stopPropagation(); Snd.click(); if (pieStack.length) { const prev = pieStack.pop(); showPie(prev.items, prev.cx, prev.cy, prev.opts); } else closePie(); };
  pie.appendChild(head);
  if (title) { const t = document.createElement('div'); t.className = 'pieTitle'; t.textContent = title; t.style.left = cx + 'px'; t.style.top = (cy + 40) + 'px'; pie.appendChild(t); }
  const R = n <= 3 ? 82 : n <= 6 ? 100 : n <= 9 ? 118 : 138;
  const placed = [];
  opt.forEach((it, i) => {
    const a = -Math.PI / 2 + (n === 1 ? 0 : i * (Math.PI * 2 / n));
    const ox = Math.cos(a), oy = Math.sin(a);
    const x = cx + ox * R, y = cy + oy * R * .82;
    const d = document.createElement('div'); d.className = 'pieOpt' + (it.sub ? ' sub' : '') + (it.dis ? ' dis' : '');
    d.innerHTML = (it.icon ? `<img src="${iconURL(it.icon, 2)}">` : '') + esc(it.label);
    d.style.animationDelay = (i * 18) + 'ms';
    pie.appendChild(d);
    const w = d.offsetWidth, h = d.offsetHeight;
    let left = ox > .3 ? x - 14 : ox < -.3 ? x - w + 14 : x - w / 2;
    placed.push({ d, x: clamp(left, 4, innerWidth - w - 4), y: y - h / 2, w, h });
    d.onmousedown = e => {
      e.stopPropagation(); if (it.dis) return; Snd.click();
      if (it.sub) { pieStack.push({ items, cx, cy, opts }); const sub = typeof it.sub === 'function' ? it.sub() : it.sub; showPie([{ head: it.label }].concat(sub.length ? sub : [{ label: 'Nobody available', dis: true }]), cx, cy, opts); return; }
      closePie(); if (it.cb) it.cb();
    };
  });
  // nudge labels apart so nothing overlaps (each other or the head)
  const pad = 5;
  for (let it = 0; it < 60; it++) {
    let moved = false;
    for (let i = 0; i < placed.length; i++) for (let j = i + 1; j < placed.length; j++) {
      const A = placed[i], Bq = placed[j];
      const ox = Math.min(A.x + A.w, Bq.x + Bq.w) - Math.max(A.x, Bq.x) + pad, oy = Math.min(A.y + A.h, Bq.y + Bq.h) - Math.max(A.y, Bq.y) + pad;
      if (ox > 0 && oy > 0) { moved = true; const up = (A.y + A.h / 2) <= (Bq.y + Bq.h / 2) ? A : Bq, dn = up === A ? Bq : A; up.y -= oy / 2; dn.y += oy / 2; }
    }
    for (const P2 of placed) { // keep clear of the head circle
      const hx = clamp(cx, P2.x, P2.x + P2.w), hy = clamp(cy, P2.y, P2.y + P2.h); const dd = Math.hypot(hx - cx, hy - cy);
      if (dd < 46) { moved = true; const dir = (P2.y + P2.h / 2) < cy ? -1 : 1; P2.y += dir * (46 - dd + 1); }
    }
    if (!moved) break;
  }
  for (const P2 of placed) { P2.d.style.left = P2.x + 'px'; P2.d.style.top = clamp(P2.y, 4, innerHeight - P2.h - 4) + 'px'; }
  Snd.pop();
}

function drawPortrait(cv, s, logical = 11, plainBg) {

  const save = C; C = tmp.getContext('2d'); C.imageSmoothingEnabled = false;

function intItems(s, o) {
  const d = OBJ[o.type]; const L = [];
  for (const it of d.ints || []) {
    if (!s.household) continue;
    const ages = it.ages || ALL; if (!ages.includes(s.stage)) continue;
    if (it.avail && !it.avail(s, o)) continue;
    const label = typeof it.label === 'function' ? it.label(s, o) : it.label;
    if (it.sub) { const subs = it.sub(s, o); L.push({ label, icon: it.icon, sub: subs.map(function mapSub(x) { return x.sub ? { label: x.label, icon: x.icon, sub: x.sub.length ? x.sub.map(mapSub) : [{ label: '(nobody available)', dis: true }] } : { label: x.label, icon: x.icon, cb: () => queueFor(s, x.make()) }; }) }); continue; }
    L.push({ label, icon: it.icon, cb: () => queueFor(s, it.make(s, o)) });
  }
  return L;
}
function queueFor(s, a) { if (!a) return; a.auto = false; if (enqueue(s, a)) { Snd.click(); status(`${s.first}: ${a.label}`); } }
function socialItems(s, t) {
  const cats = {}; const order = ['Visitor', 'Talk', 'Friendly', 'Romantic', 'Mean', 'Family'];
  for (const d of SOC) { if (!socialAvail(d, s, t)) continue; (cats[d.cat] = cats[d.cat] || []).push({ label: d.label, icon: d.icon, cb: () => queueFor(s, socialAct(s, t, d)) }); }
  const L = [];
  for (const c of order) { if (!cats[c]) continue; if (c === 'Visitor') L.push(...cats[c]); else L.push({ label: c, icon: { Talk: 'chat', Friendly: 'smile', Romantic: 'heart', Mean: 'angry', Family: 'house' }[c], sub: cats[c] }); }
  return L;
}

function biBar(v) { v = clamp(Math.round(v), -100, 100); const c = v >= 0 ? '#4fd23a' : '#ff4a30'; const l = v >= 0 ? 50 : 50 + v / 2, w = Math.abs(v) / 2; return `<div class="bar bi sunken small" style="position:relative"><i style="left:${l}%;width:${w}%;--c:${c};position:absolute;top:1px;bottom:1px"></i><span style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5)"></span></div>`; }

function serialize() {
  const sims = G.sims.filter(s => !s.service).map(s => {
    const o = Object.assign({}, s); delete o.cur; delete o.queue; delete o.path; delete o.over; delete o.bubble;
    o.posed = false; o.inSocial = null; o.carpoolWaiting = null; o.lateRiser = false;
    if (o.npc) { o.onLot = false; o.visitor = false; o.walkby = false; o.waitingDoor = false; }
    if (o.away && o.away.returning) o.away = Object.assign({}, o.away, { returning: false, until: G.time });
    return o;
  });
  const objects = G.objects.map(o => { const c = Object.assign({}, o); delete c.users; return c; });
  const g = {}; for (const k of ['time', 'nextId', 'money', 'hhName', 'rels', 'gossip', 'log', 'bills', 'pending', 'speed', 'freeWill', 'fwMode', 'convo', 'sel', 'lastParty', 'fireStart', 'fireCalled']) g[k] = G[k];
  g.pending = (G.pending || []).filter(p => p.kind !== 'socialworker' || true);
  return JSON.stringify({ v: 1, saved: Date.now(), g, sims, objects });
}

/* =====================================================================
   Main loop & input
   ===================================================================== */
let lastFrame = performance.now(), musicT = 0, musicStep = 0;
const MELODY = [523, 659, 784, 659, 587, 698, 880, 698, 523, 659, 784, 1047, 988, 784, 659, 587];
function tick(dt) {
  const before = G.time; G.time += dt;
  const m0 = Math.floor(before), m1 = Math.floor(G.time);
  for (let m = m0 + 1; m <= m1; m++) { if (m % 60 === 0) { if (m % 1440 === 0) onNewDay(); onHour(Math.floor((m % 1440) / 60)); } }
  processPending();
  updateAway();
  updateVehicles(dt);
  updateVisitors();
  for (const s of G.sims.slice()) { try { updateSim(s, dt); } catch (e) { console.error('sim update', s.first, e); s.cur = null; s.queue = []; s.over = null; } }
  // stink reactions (throttled)
  if (Math.random() < dt * .05) for (const s of lotSims()) if (s.stage !== 'baby' && s.needs.hygiene < 15) { witnessEvent('stink', s); break; }
}
function allAsleepOrAway() {
  const hs = householdSims().filter(s => s.stage !== 'baby'); if (!hs.length) return false;
  return hs.every(s => s.away || !s.onLot || (s.cur && s.cur.phase === 'act' && (s.cur.anim === 'sleep' || s.cur.anim === 'passout')));
}
function frame(now) {
  const realDt = Math.min(100, now - lastFrame); lastFrame = now;
  if (G && G.running && !G.paused && !G.over) {
    let mult = SPEEDS[G.speed] || 1; if (allAsleepOrAway()) mult = Math.max(mult, 12);
    let mins = realDt / MS_PER_MIN * mult;
    while (mins > 0) { const step = Math.min(mins, .5); tick(step); mins -= step; }
    updateFx(realDt / 1000);
    // stereo music
    if (G.objects.some(o => o.type === 'stereo' && o.st.on)) { musicT -= realDt; if (musicT <= 0) { musicT = 260; Snd.tone(MELODY[musicStep % MELODY.length], .22, 'triangle', .018); if (musicStep % 2 === 0) Snd.tone(MELODY[musicStep % MELODY.length] / 2, .2, 'square', .008); musicStep++; } }
    if (fireOnLot()) { G._alarmT = (G._alarmT || 0) - realDt; if (G._alarmT <= 0) { G._alarmT = 1800; Snd.alarm(); } }
  } else if (G && G.demo) { cam.x += Math.sin(now / 4000) * .25; clampCam(); }
  try { render(realDt); } catch (e) { console.error('render', e); }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function initInput() {
  let down = null;
  view.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, btn: e.button }; });
  addEventListener('mousemove', e => {
    if (down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.abs(dx) + Math.abs(dy) > 6) down.moved = true; if (down.moved) { cam.x = down.cx - dx / cam.zoom; cam.y = down.cy - dy / cam.zoom; cam.follow = false; clampCam(); view.style.cursor = 'move'; } }
    else if (e.target === view) worldHover(e.clientX, e.clientY);
  });
  addEventListener('mouseup', e => { if (!down) return; const d = down; down = null; view.style.cursor = ''; if (!d.moved && e.target === view) { Snd.init(); worldClick(e.clientX, e.clientY); } else if (d.moved) updateSpeedBtns(); });
  view.addEventListener('contextmenu', e => e.preventDefault());
  view.addEventListener('wheel', e => { e.preventDefault(); if (!G) return; if ((e.deltaY > 0 && cam.zoom === 2) || (e.deltaY < 0 && cam.zoom === 1)) toggleZoom(); }, { passive: false });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') { if (e.key === 'Enter' && dlgOpen) { const b = dlgOpen.querySelector('[data-b="0"]'); if (b) b.click(); } return; }
    if (e.key === 'Escape') { closeMenus(); return; }
    if (e.key === 'Enter' && dlgOpen) { e.preventDefault(); const b = dlgOpen.querySelector('[data-b="0"]'); if (b) b.click(); return; }
    if (!G || G.demo) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveGame('ll98_save', true); return; }
    if (k === 'p' || k === ' ') { e.preventDefault(); G.paused = !G.paused; updateSpeedBtns(); }
    else if (k === '0') { G.paused = true; updateSpeedBtns(); }
    else if (k === '1' || k === '2' || k === '3') setSpeed(+k);
    else if (k === 'z') toggleZoom();
    else if (k === 'f') { cam.follow = !cam.follow; updateSpeedBtns(); }
    else if (k === 'tab') { e.preventDefault(); const hs = householdSims(); if (hs.length) { const i = hs.findIndex(s => s.id === G.sel); selectSim(hs[(i + 1) % hs.length]); } }
    const pan = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] }[k];
    if (pan && !e.ctrlKey) { e.preventDefault(); cam.x += pan[0] * 32; cam.y += pan[1] * 20; cam.follow = false; clampCam(); updateSpeedBtns(); }
  });
}

window.addEventListener('load', () => {
  view = $('view'); vctx = view.getContext('2d'); buf = document.createElement('canvas'); C = buf.getContext('2d');
  initChrome(); initInput(); resizeView();
  bootScreen();
  requestAnimationFrame(frame);
  setInterval(() => { if (G && !G.demo && G.running) { try { updatePanel(); } catch (e) { console.error('panel', e); } } }, 250);
  window.addEventListener('beforeunload', () => { if (G && !G.demo && G.running && !G.over) autosave(); });
});

</script>
